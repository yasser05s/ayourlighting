     <!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayour Lighting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f1c;
    --panel:#121a2c;
    --panel-2:#161f34;
    --line:rgba(255,255,255,0.08);
    --gold:#eab308;
    --gold-deep:#ca8a04;
    --text:#f7f5f0;
    --muted:#8b96ad;
    --green:#22c55e;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Cairo',sans-serif;
    line-height:1.5;
  }
  html[dir="rtl"] body{ text-align:right; }
  a{color:inherit;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;}

  .glow-bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; }
  .glow-bg span{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.28; }
  .glow-bg span:nth-child(1){ width:420px; height:420px; background:var(--gold); top:-120px; left:-100px; }
  .glow-bg span:nth-child(2){ width:360px; height:360px; background:#7c3aed; top:30%; right:-140px; opacity:.18; }
  .glow-bg span:nth-child(3){ width:300px; height:300px; background:#0ea5e9; bottom:-100px; left:20%; opacity:.14; }

  header{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:16px 5%;
    background:rgba(10,15,28,0.85);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .logo{display:flex; align-items:center; gap:8px; font-weight:800; font-size:1.3rem; text-decoration:none; color:var(--gold); white-space:nowrap;}
  .logo .bulb{filter:drop-shadow(0 0 8px rgba(234,179,8,.7));}
  .header-actions{display:flex; align-items:center; gap:10px;}
  .lang-switch{display:flex; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px;}
  .lang-switch button{
    background:transparent; border:none; color:var(--muted); font-size:.78rem; font-weight:700;
    padding:6px 11px; border-radius:999px; transition:.25s;
  }
  .lang-switch button.active{background:var(--gold); color:#1a1400;}
  .icon-btn{
    position:relative; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    width:42px; height:42px; display:flex; align-items:center; justify-content:center; font-size:1.15rem; color:var(--text);
    border-width:1px; border-style:solid;
  }
  .cart-count{
    position:absolute; top:-6px; right:-6px; background:var(--green); color:#04270f; font-size:.68rem; font-weight:800;
    min-width:18px; height:18px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 4px;
  }
  html[dir="rtl"] .cart-count{ right:auto; left:-6px; }
  .btn-gold{
    background:linear-gradient(135deg,var(--gold),var(--gold-deep));
    color:#1a1400; font-weight:800; border:none; border-radius:11px; padding:11px 20px;
    text-decoration:none; display:inline-flex; align-items:center; gap:8px; justify-content:center;
    box-shadow:0 6px 20px rgba(234,179,8,.28); transition:.25s;
  }
  .btn-gold:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(234,179,8,.4); }
  .btn-ghost{
    background:transparent; color:var(--text); border:1px solid var(--line); border-radius:11px; padding:10px 18px; font-weight:700;
    text-decoration:none;
  }

  .hero{ padding:76px 6% 60px; text-align:center; }
  .eyebrow{
    display:inline-block; background:rgba(234,179,8,.12); color:var(--gold); font-size:.8rem; font-weight:700;
    padding:7px 16px; border-radius:999px; border:1px solid rgba(234,179,8,.3); margin-bottom:18px;
  }
  .hero h1{ font-size:clamp(2rem,4.5vw,3.1rem); font-weight:900; margin:0 0 14px; letter-spacing:-0.5px; }
  .hero .accent{ color:var(--gold); }
  .hero p{ color:var(--muted); font-size:1.08rem; max-width:560px; margin:0 auto 30px; }
  .hero-ctas{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }

  .trust{
    display:grid; grid-template-columns:repeat(3,1fr); gap:16px; max-width:920px; margin:0 auto;
    padding:0 6% 10px;
  }
  .trust-item{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 16px; display:flex; align-items:center; gap:12px;
  }
  .trust-item .ico{font-size:1.6rem;}
  .trust-item h4{margin:0; font-size:.92rem;}
  .trust-item p{margin:2px 0 0; font-size:.78rem; color:var(--muted);}

  section.block{ padding:64px 6%; max-width:1180px; margin:0 auto; }
  .section-head{ text-align:center; margin-bottom:38px; }
  .section-head h2{ font-size:1.9rem; font-weight:900; margin:12px 0 0; }

  .products-grid{ display:flex; flex-wrap:wrap; gap:26px; justify-content:center; }
  .product-card{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line); border-radius:20px; width:300px;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 14px 34px rgba(0,0,0,.35); transition:.35s;
  }
  .product-card:hover{ transform:translateY(-6px); border-color:rgba(234,179,8,.4); }
  .product-media{ position:relative; height:230px; overflow:hidden; }
  .product-media img{ width:100%; height:100%; object-fit:cover; }
  .badge{
    position:absolute; top:12px; inset-inline-start:12px; font-size:.7rem; font-weight:800; padding:5px 10px;
    border-radius:7px; background:var(--gold); color:#1a1400; z-index:2;
  }
  .badge.blue{ background:#3b82f6; color:#fff; }
  .badge.purple{ background:#8b5cf6; color:#fff; }
  .flip-btn{
    position:absolute; bottom:10px; inset-inline-end:10px; background:rgba(10,15,28,.75); border:1px solid rgba(255,255,255,.25);
    color:#fff; border-radius:999px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; font-size:1rem; z-index:2;
  }
  .flip-inner{ position:relative; width:100%; height:100%; transition:transform .6s; transform-style:preserve-3d; }
  .flip-inner.flipped{ transform:rotateY(180deg); }
  .flip-face{ position:absolute; inset:0; backface-visibility:hidden; }
  .flip-face.back{ transform:rotateY(180deg); }
  .product-body{ padding:20px; display:flex; flex-direction:column; gap:12px; flex:1; }
  .product-body h3{ margin:0; font-size:1.12rem; }
  .product-body .desc{ color:var(--muted); font-size:.85rem; margin:0; min-height:38px; }
  .price-row{ display:flex; align-items:baseline; gap:10px; margin-top:auto; }
  .price{ font-size:1.35rem; font-weight:900; color:var(--green); }
  .price-old{ font-size:.82rem; color:#5b667e; text-decoration:line-through; }
  .add-cart{
    background:var(--panel-2); border:1.5px solid var(--gold); color:var(--gold); font-weight:800;
    border-radius:11px; padding:11px; width:100%; margin-top:6px; transition:.25s;
  }
  .add-cart:hover{ background:var(--gold); color:#1a1400; }
  .add-cart.added{ background:var(--green); border-color:var(--green); color:#04270f; }

  .stars{ color:var(--gold); letter-spacing:2px; }
  .reviews-summary{ text-align:center; margin-bottom:30px; }
  .reviews-summary .big{ font-size:2.6rem; font-weight:900; }
  .reviews-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; margin-bottom:36px; }
  .review-card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .review-card .who{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-weight:700; font-size:.92rem; }
  .review-card p{ color:var(--muted); font-size:.87rem; margin:0; }
  .review-form{
    max-width:520px; margin:0 auto; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:26px;
  }
  .star-picker{ display:flex; gap:6px; font-size:1.6rem; justify-content:center; margin:10px 0 18px; direction:ltr; }
  .star-picker span{ cursor:pointer; color:#3a4256; transition:.15s; }
  .star-picker span.active{ color:var(--gold); }

  label{ display:block; margin-bottom:6px; font-size:.85rem; color:var(--muted); font-weight:600;}
  input,textarea{
    background:#0d1424; border:1px solid #263050; color:#fff; border-radius:10px; padding:12px 14px;
    width:100%; outline:none; font-family:inherit; font-size:.92rem;
  }
  input:focus,textarea:focus{ border-color:var(--gold); }
  .field{ margin-bottom:14px; }

  footer{ background:var(--panel); border-top:1px solid var(--line); padding:44px 6% 26px; margin-top:40px; }
  .footer-grid{ display:flex; flex-wrap:wrap; gap:32px; justify-content:space-between; max-width:1180px; margin:0 auto 26px; }
  .footer-col h4{ margin:0 0 12px; font-size:1rem; }
  .footer-col p, .footer-col a{ color:var(--muted); font-size:.88rem; text-decoration:none; display:block; margin-bottom:8px; }
  .footer-col a:hover{ color:var(--gold); }
  .footer-bottom{ text-align:center; color:#4b5670; font-size:.78rem; border-top:1px solid var(--line); padding-top:18px; }

  .wa-float{
    position:fixed; bottom:24px; inset-inline-end:24px; width:58px; height:58px; border-radius:50%;
    background:#25d366; display:flex; align-items:center; justify-content:center; font-size:28px; color:#fff;
    box-shadow:0 8px 22px rgba(0,0,0,.4); z-index:60; text-decoration:none;
  }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:90; opacity:0; pointer-events:none; transition:.3s; }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; inset-inline-end:0; height:100%; width:min(400px,92vw); background:var(--bg);
    border-inline-start:1px solid var(--line); z-index:95; transform:translateX(110%); transition:.35s;
    display:flex; flex-direction:column;
  }
  html[dir="rtl"] .drawer{ transform:translateX(-110%); }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ display:flex; justify-content:space-between; align-items:center; padding:20px; border-bottom:1px solid var(--line); }
  .drawer-head h3{ margin:0; }
  .drawer-close{ background:none; border:none; color:var(--text); font-size:1.4rem; }
  .drawer-body{ flex:1; overflow-y:auto; padding:16px 20px; }
  .cart-item{ display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); align-items:center; }
  .cart-item img{ width:120px; height:120px; border-radius:12px; object-fit:contain; object-position:center; flex-shrink:0; background:#000; border:1px solid var(--line); padding:4px; }
  .cart-item .info{ flex:1; }
  .cart-item .info h5{ margin:0 0 4px; font-size:.9rem; }
  .cart-item .info .p{ color:var(--green); font-weight:800; font-size:.88rem; }
  .qty-ctrl{ display:flex; align-items:center; gap:8px; }
  .qty-ctrl button{ width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:var(--panel); color:#fff; }
  .remove-btn{ background:none; border:none; color:#ef4444; font-size:1.1rem; }
  .empty-cart{ text-align:center; color:var(--muted); padding:50px 10px; }
  .drawer-foot{ padding:18px 20px 24px; border-top:1px solid var(--line); }
  .subtotal-row{ display:flex; justify-content:space-between; margin-bottom:10px; font-weight:700; font-size:.92rem; color:var(--muted); }

  @media(max-width:720px){
    .trust{ grid-template-columns:1fr; }
    header{ padding:14px 4%; }
  }
</style>
</head>

const DEFAULT_REVIEWS = [
  {name:{fr:"Sara B.",ar:"سارة ب.",en:"Sara B."}, stars:5, comment:{fr:"Livraison rapide et applique magnifique, exactement comme sur les photos !",ar:"توصيل سريع والأبليك رائع، بالضبط كيما فالصور!",en:"Fast delivery and a beautiful lamp, exactly like the photos!"}},
  {name:{fr:"Youssef M.",ar:"يوسف م.",en:"Youssef M."}, stars:5, comment:{fr:"Très bonne qualité, le ruban LED illumine parfaitement mon salon.",ar:"جودة زوينة بزاف، شريط LED ضوى الصالون بشكل رائع.",en:"Great quality, the LED strip lights up my living room perfectly."}},
  {name:{fr:"Imane K.",ar:"إيمان ك.",en:"Imane K."}, stars:5, comment:{fr:"Service client au top sur WhatsApp, très réactifs. Je recommande !",ar:"خدمة الزبناء زوينة بزاف فواتساب، سريعين فالجواب. كنصح بيها!",en:"Excellent customer service on WhatsApp, very responsive. Recommended!"}}
];

let currentLang = localStorage.getItem("ayourLang") || "fr";
let cart = JSON.parse(localStorage.getItem("ayourCart") || "[]");
let reviews = JSON.parse(localStorage.getItem("ayourReviews") || "null") || DEFAULT_REVIEWS;
let selectedStars = 5;

function setLanguage(lang){
  currentLang = lang;
  localStorage.setItem("ayourLang", lang);
  document.getElementById("htmlRoot").setAttribute("lang", lang);
  document.getElementById("htmlRoot").setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
  document.querySelectorAll(".lang-switch button").forEach(b=>{
    b.classList.toggle("active", b.dataset.lang === lang);
  });
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    el.textContent = I18N[lang][el.dataset.i18n] || "";
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{
    el.innerHTML = I18N[lang][el.dataset.i18nHtml] || "";
  });
  renderProducts();
  renderReviews();
  renderCart();
}

function renderProducts(){
  const grid = document.getElementById("productsGrid");
  grid.innerHTML = "";
  PRODUCTS.forEach(p=>{
    const card = document.createElement("div");
    card.className = "product-card";
    const priceOld = p.oldPrice ? `<span class="price-old">${p.oldPrice} DH</span>` : "";
    const unitLabel = p.unit ? `<span class="price-old" style="text-decoration:none">${p.unit[currentLang]}</span>` : "";
    const media = `<img src="${p.img}" onerror="this.src='${p.fallback}'" alt="${p.name[currentLang]}">`;

    card.innerHTML = `
      <div class="product-media">
        ${media}
        <span class="badge ${p.badgeClass}">${p.badge[currentLang]}</span>
      </div>
      <div class="product-body">
        <h3>${p.name[currentLang]}</h3>
        <p class="desc">${p.desc[currentLang]}</p>
        <div class="price-row"><span class="price">${p.price} DH</span>${unitLabel}${priceOld}</div>
        <button class="add-cart" id="add-${p.id}" onclick="addToCart('${p.id}')">${I18N[currentLang].add_to_cart}</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function flipCard(id){
  document.getElementById("flip-"+id).classList.toggle("flipped");
}

function saveCart(){ localStorage.setItem("ayourCart", JSON.stringify(cart)); }

function addToCart(id){
  const product = PRODUCTS.find(p=>p.id===id);
  const existing = cart.find(c=>c.id===id);
  if(existing){ existing.qty++; } else { cart.push({id:product.id, qty:1}); }
  saveCart();
  renderCart();
  const btn = document.getElementById("add-"+id);
  const original = I18N[currentLang].add_to_cart;
  btn.textContent = I18N[currentLang].added_to_cart;
  btn.classList.add("added");
  setTimeout(()=>{ btn.textContent = original; btn.classList.remove("added"); }, 1200);
}

function changeQty(id, delta){
  const item = cart.find(c=>c.id===id);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0){ cart = cart.filter(c=>c.id!==id); }
  saveCart();
  renderCart();
}

function removeFromCart(id){
  cart = cart.filter(c=>c.id!==id);
  saveCart();
  renderCart();
}

function renderCart(){
  const body = document.getElementById("cartBody");
  const foot = document.getElementById("cartFoot");
  const t = I18N[currentLang];
  document.getElementById("cartCount").textContent = cart.reduce((s,c)=>s+c.qty,0);

  if(cart.length === 0){
    body.innerHTML = `<div class="empty-cart">${t.cart_empty}</div>`;
    foot.innerHTML = "";
    return;
  }

  let subtotal = 0;
  body.innerHTML = cart.map(c=>{
    const p = PRODUCTS.find(pp=>pp.id===c.id);
    subtotal += p.price * c.qty;
    return `
      <div class="cart-item">
        <img src="${p.img}" onerror="this.src='${p.fallback}'">
        <div class="info">
          <h5>${p.name[currentLang]}</h5>
          <div class="p">${p.price} DH${p.unit ? " "+p.unit[currentLang] : ""}</div>
          <div class="qty-ctrl">
            <button onclick="changeQty('${p.id}',-1)">−</button>
            <span>${c.qty}</span>
            <button onclick="changeQty('${p.id}',1)">+</button>
          </div>
        </div>
        <button class="remove-btn" onclick="removeFromCart('${p.id}')">🗑️</button>
      </div>
    `;
  }).join("");

  foot.innerHTML = `
    <div class="subtotal-row"><span>${t.cart_subtotal}</span><span>${subtotal} DH</span></div>
    <div class="field"><label>${t.cart_name}</label><input id="ckName"></div>
    <div class="field"><label>${t.cart_phone}</label><input id="ckPhone" type="tel"></div>
    <div class="field"><label>${t.cart_city}</label><input id="ckCity"></div>
    <button class="btn-gold" style="width:100%" onclick="checkoutWhatsapp(${subtotal})">${t.cart_checkout} 📲</button>
  `;
}

function checkoutWhatsapp(subtotal){
  const name = document.getElementById("ckName").value;
  const phone = document.getElementById("ckPhone").value;
  const city = document.getElementById("ckCity").value;
  let lines = cart.map(c=>{
    const p = PRODUCTS.find(pp=>pp.id===c.id);
    return `- ${p.name[currentLang]} x${c.qty} (${p.price*c.qty} DH)`;
  }).join("%0A");
  const msg = `Nouvelle commande / طلب جديد 🛒:%0A` +
    `${lines}%0A` +
    `Total: ${subtotal} DH%0A%0A` +
    `Nom: ${name}%0A` +
    `Téléphone: ${phone}%0A` +
    `Ville: ${city}`;
  window.open(`https://wa.me/212675626129?text=${msg}`, "_blank");
}

function openCart(){
  document.getElementById("overlay").classList.add("open");
  document.getElementById("cartDrawer").classList.add("open");
}
function closeCart(){
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("cartDrawer").classList.remove("open");
}

function saveReviews(){ localStorage.setItem("ayourReviews", JSON.stringify(reviews)); }

function renderReviews(){
  const grid = document.getElementById("reviewsGrid");
  grid.innerHTML = reviews.map(r=>`
    <div class="review-card">
      <div class="who"><span>${typeof r.name === "object" ? r.name[currentLang] : r.name}</span><span class="stars">${"★".repeat(r.stars)}${"☆".repeat(5-r.stars)}</span></div>
      <p>${typeof r.comment === "object" ? r.comment[currentLang] : r.comment}</p>
    </div>
  `).join("");
  const avg = (reviews.reduce((s,r)=>s+r.stars,0)/reviews.length).toFixed(1);
  document.getElementById("avgRating").textContent = avg;
  const countLabel = {fr:`Basé sur ${reviews.length} avis`, ar:`استناداً إلى ${reviews.length} تقييم`, en:`Based on ${reviews.length} reviews`};
  document.getElementById("reviewCountText").textContent = countLabel[currentLang];
}

document.getElementById("starPicker").addEventListener("click", (e)=>{
  if(e.target.tagName !== "SPAN") return;
  selectedStars = parseInt(e.target.dataset.v);
  document.querySelectorAll("#starPicker span").forEach(s=>{
    s.classList.toggle("active", parseInt(s.dataset.v) <= selectedStars);
  });
});
document.querySelectorAll("#starPicker span").forEach(s=>s.classList.add("active"));

function submitReview(){
  const name = document.getElementById("reviewName").value.trim();
  const comment = document.getElementById("reviewComment").value.trim();
  if(!name || !comment){
    alert(currentLang==="ar" ? "المرجو تعبئة الاسم والتعليق" : currentLang==="en" ? "Please fill in your name and comment" : "Merci de remplir votre nom et commentaire");
    return;
  }
  reviews.unshift({name, stars:selectedStars, comment});
  saveReviews();
  renderReviews();
  document.getElementById("reviewName").value = "";
  document.getElementById("reviewComment").value = "";
}

document.getElementById("year").textContent = new Date().getFullYear();
setLanguage(currentLang);
</script>
</body>
</html>
